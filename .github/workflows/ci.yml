name: CI

# Catches a broken backend before it reaches PRODUCTION — and therefore before
# it takes the live API down. There is no test suite yet, so this is a syntax
# and dependency gate rather than a behavioural one.

on:
  pull_request:
    branches: [PRODUCTION, main]
  push:
    # PRODUCTION is excluded: deploy.yml already runs these same checks.
    branches-ignore: [PRODUCTION]

jobs:
  verify:
    name: Install and syntax check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: npm

      # Proves the lockfile still resolves. cPanel runs `npm install` against
      # this same lockfile, so a failure here is a failure there.
      - name: Install dependencies
        run: npm ci

      # Parses every file the deploy would ship without executing any of it —
      # requiring server.js would try to open a database connection.
      - name: Syntax check
        run: find app.js src -name '*.js' -print0 | xargs -0 -n1 node --check
